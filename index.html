<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>$borazio-root v1.01 - functional engineering kernel</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        /* system core config */
        * {
            box-sizing: border-box;
            image-rendering: pixelated;
            cursor: none !important;
        }

        html, body {
            background-color: #000;
            color: #b5b5b5; /* Cinza geral um pouco mais claro */
            font-family: 'VT323', monospace;
            font-size: 20px; /* Texto pequeno */
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            -webkit-font-smoothing: none;
            cursor: none !important;
        }

        /* Cores solicitadas para o texto de boas-vindas customizado */
        .color-cyan { color: #00ffff; }
        .color-yellow { color: #ffff00; }
        .color-green { color: #55ff55; } /* Verde claro para o $borazio-root */

        /* Estilo visual para a barra de cores customizada ao lado do texto de boas-vindas da Room */
        .room-banner-line {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 5px 0;
            flex-wrap: nowrap;
        }

        .color-bars-container {
            display: inline-flex;
            height: 18px;
            border: 1px solid #444;
        }

        .cb-block {
            width: 10px;
            height: 18px;
        }

        /* pure terminal wrapper */
        #terminal-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            height: 100vh;
            width: 100vw;
            padding: 10px;
            overflow-y: auto;
            scrollbar-width: none;
            cursor: none !important;
        }
        #terminal-wrapper::-webkit-scrollbar { display: none; }

        #history {
            white-space: pre-wrap;
            word-wrap: break-word;
            padding: 0;
        }

        .input-line {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 0;
            margin: 0;
        }

        .prompt-text {
            white-space: nowrap;
            color: #b5b5b5;
        }

        #user-input {
            background: transparent;
            border: none;
            color: #cccccc;
            font-family: 'VT323', monospace;
            font-size: 20px;
            outline: none;
            flex-grow: 1;
            margin-left: 5px;
            caret-shape: block;
            cursor: none !important;
        }

        .line-output { padding: 0; margin: 0; color: #b5b5b5; }
        .ok-status { color: #cccccc; font-weight: normal; text-decoration: none; }
    </style>
</head>
<body id="os-root">

    <div id="terminal-wrapper">
        <div id="history"></div>
        <div class="input-line" id="input-container" style="display: none;">
            <span class="prompt-text" id="prompt-label">("true") ["main"] = "<span class="color-green">$borazio-root</span>":</span>
            <input type="text" id="user-input" autofocus spellcheck="false" autocomplete="off">
        </div>
    </div>

    <script>
        /* ==========================================================
           KERNEL LÓGICO NATIVO DE ENGENHARIA (COM OS BUILD TOOLS NAS ROOMS)
           ========================================================== */
        const KernelCore = {
            version: "1.01-native-functional",
            uptimeStart: performance.now(),
            
            getUptime() {
                return Math.floor((performance.now() - this.uptimeStart) / 1000);
            },

            getMemoryUsage() {
                return "1024 kb physical mapping segment / 4096 kb mapped virtual pool";
            }
        };

        const historyDiv = document.getElementById('history');
        const input = document.getElementById('user-input');
        const wrapper = document.getElementById('terminal-wrapper');
        const inputContainer = document.getElementById('input-container');
        
        let PROMPT_BASE = '("true") ["main"] = "$borazio-root":';
        const SUFFIX = " gui/'$'/";

        let currentDir = "/root";
        let networkingEnabled = false;

        // Gerenciamento avançado de Rooms / Projetos OS (Inicia obrigatoriamente na main_room)
        let osRooms = [
            { 
                name: "main_room", 
                description: "default primary os workspace", 
                memoryAllocation: "1024kb", 
                created: Date.now(),
                historyHTML: "",
                customCommands: {}, 
                osConfig: {
                    kernelName: "borazio-core",
                    targetArchitecture: "x86_64-generic",
                    bootloaderType: "uefi-lfs",
                    compilerFlags: "-O2 -pipe",
                    packagesCount: 12
                },
                checklist: [
                    { id: 1, text: "initialize native storage subsystem", done: true }
                ],
                fileSystem: {
                    "/root": { type: "dir", files: { "readme.txt": "welcome to main_room workspace environment." } },
                    "/sys": { type: "dir", files: { "cpu.cfg": "core=lfs-core1\nfreq=1mhz" } },
                    "/bin": { type: "dir", files: {} },
                    "/var/log": { type: "dir", files: { "kernel.log": "[0.000] main_room booted" } },
                    "/tasks": { type: "dir", files: { "todos.lst": "1. [x] main room task" } }
                }
            }
        ];

        let activeRoomIndex = 0; // Forçado para main_room
        let fileSystem = osRooms[activeRoomIndex].fileSystem;
        let kernelVariables = {
            "path": { val: "/root", dependsOn: null, active: true },
            "state": { val: "active", dependsOn: null, active: true },
            "kernel_version": { val: "1.01", dependsOn: null, active: true }
        };
        let backgroundProcesses = {};
        let pidCounter = 100;
        let isHalted = false;

        function outProgressive(linesArray, callback, delayMs = 35) {
            let index = 0;
            inputContainer.style.display = 'none';

            function nextLine() {
                if (index < linesArray.length) {
                    let text = linesArray[index];
                    const div = document.createElement('div');
                    div.className = 'line-output';
                    div.textContent = text.toLowerCase() + SUFFIX;
                    historyDiv.appendChild(div);
                    wrapper.scrollTop = wrapper.scrollHeight;
                    index++;
                    setTimeout(nextLine, delayMs);
                } else {
                    inputContainer.style.display = 'flex';
                    wrapper.scrollTop = wrapper.scrollHeight;
                    input.focus();
                    if (callback) callback();
                }
            }
            nextLine();
        }

        function outHTML(htmlContent) {
            const div = document.createElement('div');
            div.className = 'line-output';
            div.innerHTML = htmlContent;
            historyDiv.appendChild(div);
            wrapper.scrollTop = wrapper.scrollHeight;
        }

        function out(text) {
            const div = document.createElement('div');
            div.className = 'line-output';
            div.textContent = text.toLowerCase() + SUFFIX;
            historyDiv.appendChild(div);
            wrapper.scrollTop = wrapper.scrollHeight;
            
            if (fileSystem["/var/log"] && fileSystem["/var/log"].files["kernel.log"]) {
                fileSystem["/var/log"].files["kernel.log"] += `\n[${KernelCore.getUptime()}s] output: ${text.toLowerCase()}`;
            }
        }

        function appendRoomWelcomeBanner(roomName) {
            if (roomName === "main_room") {
                const textDiv = document.createElement('div');
                textDiv.className = 'line-output';
                textDiv.textContent = `wellcome to ${roomName}`.toLowerCase() + SUFFIX;
                historyDiv.appendChild(textDiv);
                wrapper.scrollTop = wrapper.scrollHeight;
                return;
            }

            const containerDiv = document.createElement('div');
            containerDiv.className = 'room-banner-line';
            
            const textSpan = document.createElement('span');
            textSpan.className = 'line-output';
            textSpan.textContent = `wellcome to ${roomName}`.toLowerCase() + SUFFIX;
            
            const colors = ['#999999', '#ff5555', '#55ff55', '#ffff55', '#5555ff', '#ff55ff', '#55ffff', '#ffffff'];
            const barContainer = document.createElement('div');
            barContainer.className = 'color-bars-container';
            
            colors.forEach(col => {
                const block = document.createElement('div');
                block.className = 'cb-block';
                block.style.backgroundColor = col;
                barContainer.appendChild(block);
            });

            containerDiv.appendChild(textSpan);
            containerDiv.appendChild(barContainer);
            historyDiv.appendChild(containerDiv);
            wrapper.scrollTop = wrapper.scrollHeight;
        }

        function saveCurrentRoomState() {
            osRooms[activeRoomIndex].historyHTML = historyDiv.innerHTML;
            osRooms[activeRoomIndex].fileSystem = fileSystem;
        }

        function switchRoomInterface(targetIndex) {
            saveCurrentRoomState();
            activeRoomIndex = targetIndex;
            fileSystem = osRooms[activeRoomIndex].fileSystem;
            if (!osRooms[activeRoomIndex].checklist) osRooms[activeRoomIndex].checklist = [];
            if (!osRooms[activeRoomIndex].customCommands) osRooms[activeRoomIndex].customCommands = {};
            if (!osRooms[activeRoomIndex].osConfig) {
                osRooms[activeRoomIndex].osConfig = {
                    kernelName: osRooms[activeRoomIndex].name + "-kernel",
                    targetArchitecture: "x86_64-generic",
                    bootloaderType: "uefi-lfs",
                    compilerFlags: "-O2 -pipe",
                    packagesCount: 10
                };
            }
            
            historyDiv.innerHTML = osRooms[activeRoomIndex].historyHTML || "";
            wrapper.scrollTop = wrapper.scrollHeight;
        }

        function runMassiveExecutionSequence(programName = "suite_diagnostics") {
            let rawActions = [
                `spawning master execution container for '${programName}'`,
                "allocating isolated thread pool memory mapping",
                "mounting temporary swap segments for runtime variables",
                "verifying binary file headers and bytecode structure",
                "resolving absolute dynamic library dependencies",
                "initializing hardware abstraction layer interfaces",
                "flushing CPU instruction pipeline caches",
                "establishing secure inter-process communication pipes",
                "loading core symbol tables into kernel space",
                "allocating stack frames for primary execution thread",
                "verifying stack pointer alignment and bounds",
                "initializing memory protection rings (ring 0 to ring 3)",
                "mounting virtual file system overlay for program context",
                "dispatching pre-execution hooks and triggers",
                "executing garbage collection sweep on stale pointers",
                "verifying integrity of persistent nvram blocks",
                "allocating heap space for dynamic data structures",
                "loading string literal tables into data segment",
                "registering exception handling vector tables",
                "checking arithmetic coprocessor availability",
                "initializing floating-point calculation registers",
                "setting up vector processing execution extensions",
                "verifying network stack loopback interface controllers",
                "allocating socket descriptor table structures",
                "binding program context to local environment variables",
                "scanning file system for configuration override files",
                "parsing configuration syntax blocks",
                "applying runtime performance profile flags",
                "dispatching initialization signal to child handlers",
                "verifying synchronization locks and mutex primitives",
                "allocating shared memory segment pools",
                "mapping input/output device redirection channels",
                "clearing volatile register banks",
                "loading primary application bytecode into instruction cache",
                "performing sanity checks on instruction pointer offsets",
                "executing baseline performance benchmark suite",
                "analyzing core temperature and power telemetry",
                "adjusting voltage regulation parameters",
                "synchronizing real-time clock oscillators",
                "verifying cryptographic seed generator entropy",
                "mounting secure temporary storage scratchpad",
                "dispatching thread synchronization barriers",
                "initializing graphical buffer frame-buffers",
                "setting up retro block text rendering pipelines",
                "verifying character set encoding tables",
                "allocating color palette lookup indices",
                "flushing video RAM cache segments",
                "dispatching hardware interrupt request lines (IRQs)",
                "verifying direct memory access (DMA) channel status",
                "initializing storage block controller queues",
                "checking sector allocation maps for fragmentation",
                "optimizing file node index allocation tables",
                "mounting user-space application workspace",
                "verifying user permission flags and access controls",
                "allocating session state tracking structures",
                "initializing event dispatcher loop controllers",
                "registering asynchronous callback queues",
                "verifying timer interrupt precision vectors",
                "dispatching background telemetry collection agents",
                "analyzing system bottleneck performance indicators",
                "tuning dynamic scheduling priority weights",
                "verifying kernel module signature integrity",
                "loading auxiliary diagnostic utility packages",
                "executing stress test on math processor loops",
                "verifying multi-threaded concurrency safety locks",
                "checking deadlock prevention state monitors",
                "allocating buffer pools for stream input operations",
                "initializing string formatting conversion engines",
                "verifying regex pattern matching processor blocks",
                "dispatching parser state machine configurations",
                "loading symbol debugging metadata containers",
                "verifying memory leak detection triggers",
                "initializing runtime profiling hooks",
                "calibrating system responsiveness metrics",
                "dispatching notification broadcast signals",
                "verifying inter-node cluster communication channels",
                "checking redundant storage mirror parity blocks",
                "allocating fault-tolerance recovery checkpoints",
                "initializing secure cryptographic cipher wrappers",
                "verifying digital signature validation keys",
                "dispatching audit trail logging handlers",
                "writing execution snapshot to persistent log files",
                "verifying log rotation policy boundaries",
                "cleaning temporary workspace scratchpad sectors",
                "reclaiming unused heap memory segments",
                "compacting fragmented virtual memory blocks",
                "verifying file system journaling consistency",
                "updating master node allocation index tables",
                "dispatching synchronization signals to storage media",
                "verifying hardware register persistence states",
                "releasing exclusive hardware bus locks",
                "restoring standard power management profiles",
                "dispatching completion status notifications",
                "verifying exit code return values",
                "closing active inter-process communication channels",
                "unloading dynamic library symbol containers",
                "flushing remaining write buffers to persistent nvram",
                "terminating isolated thread pool execution contexts",
                "reclaiming master execution container descriptors",
                `program '${programName}' execution routine successfully completed`
            ];

            let massiveLines = rawActions.map(act => `    [z]      --(${act}) ... [OK]`);
            massiveLines.unshift(`initiating massive multi-threaded execution sequence for '${programName}'...`);
            massiveLines.push(`execution suite '${programName}' finished with exit code 0 [OK].`);

            outProgressive(massiveLines, null, 25);
        }

        function runBootSequence() {
            activeRoomIndex = 0;
            fileSystem = osRooms[0].fileSystem;
            currentDir = "/root";
            historyDiv.innerHTML = "";

            let welcomeMsg = `Welcome to <span class="color-cyan">BorazioOS</span>!`;
            let netMsg = `Networking is disabled by default, run <span class="color-yellow">./networking.</span> to enable`;
            let sxMsg = `For the Xord desktop, run <span class="color-yellow">./startsx.</span>`;

            outHTML(welcomeMsg + SUFFIX);
            outHTML(""); 
            outHTML(netMsg + SUFFIX);
            outHTML(""); 
            outHTML(sxMsg + SUFFIX);
            outHTML(""); 

            appendRoomWelcomeBanner(osRooms[activeRoomIndex].name);
            updatePrompt();
            inputContainer.style.display = 'flex';
            input.focus();
        }

        runBootSequence();

        function enableFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }
        window.addEventListener('mousemove', enableFullScreen, { once: true });
        window.addEventListener('click', enableFullScreen, { once: true });

        input.addEventListener('keydown', (e) => {
            if (isHalted) {
                if (e.key === 'Enter') location.reload(); 
                return;
            }

            if (e.key === 'Enter') {
                const commandString = input.value.trim();
                const lowerCmd = commandString.toLowerCase();
                
                const historyLine = document.createElement('div');
                historyLine.className = 'line-output';
                let formattedPrompt = `("true") ["${currentDir}"] = "<span class="color-green">$borazio-root</span>":`;
                historyLine.innerHTML = `${formattedPrompt} ${lowerCmd}`;
                historyDiv.appendChild(historyLine);

                processInput(lowerCmd);
                input.value = '';
                wrapper.scrollTop = wrapper.scrollHeight;
            }
        });

        function getFlag(args, flag, defaultValue) {
            let index = args.indexOf(flag);
            if (index !== -1 && args[index + 1]) {
                return args[index + 1];
            }
            return defaultValue;
        }

        async function processInput(fullCmd) {
            if (!fullCmd) return;
            const parts = fullCmd.split(/\s+/);
            let cmd = parts[0].toLowerCase();
            const args = parts.slice(1);
            let fullAction = fullCmd;

            // Compatibilidade para comandos de uma palavra exigirem "/"
            const singleWordCommands = [
                'help', 'checklist', 'next-room', 'prev-room', 'reset', 'clear', 
                'shutdown', 'storage-space', 'kernel', 'ls', 'cd', 'mkdir', 'touch', 
                'cat', 'rm', 'edit', 'du', 'theme', 'fortune', 'sysinfo', 'top', 
                'ps', 'kill', 'bus', 'hexdump', 'gate', 'cache', 'matrix', 'rst-scr', 
                'ver', 'halt', 'save', 'startsx', 'networking'
            ];

            // Se o comando for de uma palavra e não começar com '/', ajustamos ou avisamos
            if (singleWordCommands.includes(cmd)) {
                out(`error: single-word commands must start with '/' (e.g., /${cmd}). type /help for options.`);
                return;
            }

            // Se o usuário digitou com barra (ex: /help), removemos a barra para processar internamente
            if (cmd.startsWith('/') && singleWordCommands.includes(cmd.substring(1))) {
                cmd = cmd.substring(1);
            }

            let currentRoomCustomCmds = osRooms[activeRoomIndex].customCommands || {};
            if (currentRoomCustomCmds[fullAction] !== undefined) {
                out(currentRoomCustomCmds[fullAction]);
                return;
            }
            if (currentRoomCustomCmds[cmd] !== undefined) {
                out(currentRoomCustomCmds[cmd]);
                return;
            }

            switch(true) {
                case (cmd === './networking.' || cmd === 'networking'):
                    networkingEnabled = true;
                    out("network stack initialization sequence complete. interfaces (eth0, lo) up and active.");
                    break;

                case (cmd === './startsx.' || cmd === 'startsx'):
                    out("launching Xord display server window manager...");
                    setTimeout(() => {
                        let sxBox = [
                            "+--------------------------------------------------+",
                            "| Xord Desktop Environment v1.0 - Active Workspace |",
                            "+--------------------------------------------------+",
                            "| [1] Terminal   [2] File Manager   [3] SysMonitor |",
                            "|                                                  |",
                            "| Window [Root /home]                              |",
                            "| Type 'exit-x' to return to shell console.        |",
                            "+--------------------------------------------------"
                        ];
                        sxBox.forEach(line => out(line));
                    }, 400);
                    break;

                case (cmd === 'exit-x'):
                    out("terminating Xord display server session. restoring text-mode terminal...");
                    break;

                case (cmd === 'os-config' || cmd === 'os-info'):
                    let cfg = osRooms[activeRoomIndex].osConfig;
                    let configLines = [
                        `--- os project configuration for [${osRooms[activeRoomIndex].name}] ---`,
                        ` - kernel name: ${cfg.kernelName}`,
                        ` - target architecture: ${cfg.targetArchitecture}`,
                        ` - bootloader type: ${cfg.bootloaderType}`,
                        ` - compiler flags: ${cfg.compilerFlags}`,
                        ` - bundled packages: ${cfg.packagesCount} modules`
                    ];
                    outProgressive(configLines);
                    break;

                case (cmd === 'os-set-kernel'):
                    let newKName = args.join(' ');
                    if (!newKName) { out("error: provide kernel name."); break; }
                    osRooms[activeRoomIndex].osConfig.kernelName = newKName;
                    out(`os project kernel name updated to '${newKName}'.`);
                    break;

                case (cmd === 'os-set-arch'):
                    let newArch = args[0];
                    if (!newArch) { out("error: provide architecture (e.g. x86_64, arm64, riscv64)."); break; }
                    osRooms[activeRoomIndex].osConfig.targetArchitecture = newArch;
                    out(`os project target architecture set to '${newArch}'.`);
                    break;

                case (cmd === 'os-compile' || cmd === 'build-os'):
                    let compSteps = [
                        `    [z]      --(initializing cross-compiler toolchain for ${osRooms[activeRoomIndex].osConfig.targetArchitecture}) ... [OK]`,
                        `    [z]      --(compiling kernel image '${osRooms[activeRoomIndex].osConfig.kernelName}' with flags ${osRooms[activeRoomIndex].osConfig.compilerFlags}) ... [OK]`,
                        `    [z]      --(packaging bootloader sectors (${osRooms[activeRoomIndex].osConfig.bootloaderType})) ... [OK]`,
                        `    [z]      --(bundling ${osRooms[activeRoomIndex].osConfig.packagesCount} core user-space packages) ... [OK]`,
                        `os project build completed successfully! ISO bootable image generated in workspace.`
                    ];
                    outProgressive(compSteps);
                    break;

                case (fullAction.includes('create room') || fullAction.includes('new room') || fullAction.includes('room-create') || fullAction.includes('create-room')):
                    let rName = getFlag(args, '--name', `room_${osRooms.length + 1}`);
                    let rDesc = getFlag(args, '--desc', 'custom isolated os project environment');
                    let rMem = getFlag(args, '--memory', '2048kb');
                    
                    saveCurrentRoomState();

                    osRooms.push({ 
                        name: rName, 
                        description: rDesc, 
                        memoryAllocation: rMem, 
                        created: Date.now(),
                        historyHTML: "",
                        customCommands: {},
                        osConfig: {
                            kernelName: rName + "-kernel",
                            targetArchitecture: "x86_64-generic",
                            bootloaderType: "uefi-lfs",
                            compilerFlags: "-O2 -pipe",
                            packagesCount: 8
                        },
                        checklist: [
                            { id: 1, text: `initialize room ${rName}`, done: false }
                        ],
                        fileSystem: {
                            "/root": { type: "dir", files: { "readme.txt": `welcome to workspace room: ${rName}` } },
                            "/sys": { type: "dir", files: { "cpu.cfg": "core=lfs-core1" } },
                            "/bin": { type: "dir", files: {} },
                            "/var/log": { type: "dir", files: { "kernel.log": "[0.000] room initialized" } },
                            "/tasks": { type: "dir", files: { "todos.lst": "1. [ ] initial task" } }
                        }
                    });
                    
                    switchRoomInterface(osRooms.length - 1);
                    appendRoomWelcomeBanner(rName);
                    
                    let creationSteps = [
                        `    [z]      --(allocating isolated sector map for new os project room '${rName}') ... [OK]`,
                        `    [z]      --(assigning memory segment boundaries (${rMem})) ... [OK]`,
                        `    [z]      --(registering project metadata descriptor: "${rDesc}") ... [OK]`,
                        `    [z]      --(mounting dedicated virtual file system nodes for '${rName}') ... [OK]`,
                        `room project '${rName}' successfully created and active workspace interface loaded.`
                    ];
                    outProgressive(creationSteps);
                    break;

                case (cmd === 'open-room' || cmd === 'room-open' || fullAction.includes('open room')):
                    let targetOpen = getFlag(args, '--name', args[0]);
                    if (!targetOpen) {
                        out("error: specify room name or index using '--name [name]' or directly as argument.");
                        break;
                    }
                    let foundIdx = -1;
                    let numId = parseInt(targetOpen);
                    if (!isNaN(numId) && numId > 0 && numId <= osRooms.length) {
                        foundIdx = numId - 1;
                    } else {
                        foundIdx = osRooms.findIndex(r => r.name.toLowerCase() === targetOpen.toLowerCase());
                    }

                    if (foundIdx !== -1) {
                        switchRoomInterface(foundIdx);
                        out(`successfully opened room: [${osRooms[activeRoomIndex].name}]. interface context fully updated.`);
                    } else {
                        out(`error: room '${targetOpen}' not found.`);
                    }
                    break;

                case (cmd === 'next-room' || cmd === 'room-next' || fullAction.includes('next room')):
                    if (osRooms.length <= 1) {
                        out("error: only one active room exists. create another room first.");
                        break;
                    }
                    let nextIdx = (activeRoomIndex + 1) % osRooms.length;
                    switchRoomInterface(nextIdx);
                    out(`switched to next room interface: [${osRooms[activeRoomIndex].name}] (${activeRoomIndex + 1}/${osRooms.length}).`);
                    break;

                case (cmd === 'prev-room' || cmd === 'room-prev' || fullAction.includes('prev room')):
                    if (osRooms.length <= 1) {
                        out("error: only one active room exists.");
                        break;
                    }
                    let prevIdx = (activeRoomIndex - 1 + osRooms.length) % osRooms.length;
                    switchRoomInterface(prevIdx);
                    out(`switched to previous room interface: [${osRooms[activeRoomIndex].name}] (${activeRoomIndex + 1}/${osRooms.length}).`);
                    break;

                case (cmd === 'room-del' || cmd === 'delete-room' || fullAction.includes('delete room') || fullAction.includes('room-delete')):
                    let targetRoom = getFlag(args, '--name', '');
                    if (!targetRoom && osRooms.length > 0) {
                        targetRoom = osRooms[activeRoomIndex].name;
                    }
                    if (osRooms.length <= 1) {
                        out("error: cannot delete the last remaining room workspace.");
                        break;
                    }
                    let rIdx = osRooms.findIndex(r => r.name.toLowerCase() === targetRoom.toLowerCase());
                    if (rIdx !== -1) {
                        osRooms.splice(rIdx, 1);
                        let fallbackIdx = rIdx > 0 ? rIdx - 1 : 0;
                        switchRoomInterface(fallbackIdx);
                        out(`os project room '${targetRoom}' deleted. interface shifted to [${osRooms[activeRoomIndex].name}].`);
                    } else {
                        out(`error: room '${targetRoom}' not found.`);
                    }
                    break;

                case (cmd === 'help'):
                    let helpLines = [
                        "--- native functional engineering kernel toolset ---",
                        "system binaries: ./networking., ./startsx.",
                        "os build tools:  os-config, os-set-kernel [name], os-set-arch [arch], os-compile",
                        "rooms management: create room --name [name] --desc [desc] --memory [size]",
                        "                  open room --name [name], /next-room, /prev-room, rooms-list",
                        "                  delete room --name [name], make-room-cmd --cmd [name] --output [text]",
                        "room checklists:  /checklist, add-check --text [item], done-check --id [n], del-check --id [n]",
                        "massive execution: run-suite --name [program], exec-all, simulate-pipeline",
                        "system control:  /reset, /clear, /shutdown, /reboot, exit",
                        "file management: mkfile --name [file] --text [content], /rm [file], delete-file --name [file]",

                    break;

                case (cmd === 'sysinfo'):
                    let sysinfoLines = [
                        `kernel version: ${KernelCore.version}`,
                        `system uptime: ${KernelCore.getUptime()} seconds`,
                        `memory status: ${KernelCore.getMemoryUsage()}`
                    ];
                    outProgressive(sysinfoLines);
                    break;

                case (cmd === 'top' || cmd === 'ps'):
                    let psLines = [
                        "pid  state  uptime(s)  command",
                        "100  run    " + KernelCore.getUptime() + "      /bin/kernel_shell"
                    ];
                    for (let p in backgroundProcesses) {
                        let uptimeTask = Math.floor((Date.now() - backgroundProcesses[p].time) / 1000);
                        psLines.push(`${p}  bg     ${uptimeTask}      ${backgroundProcesses[p].name}`);
                    }
                    outProgressive(psLines);
                    break;

                case (cmd === 'kill'):
                    if (!args[0]) { out("error: specify pid."); break; }
                    if (backgroundProcesses[args[0]]) {
                        clearInterval(backgroundProcesses[args[0]].timer);
                        delete backgroundProcesses[args[0]];
                        out(`process pid ${args[0]} terminated.`);
                    } else {
                        out(`error: pid ${args[0]} not found.`);
                    }
                    break;

                case (cmd === 'bus'):
                    let pid = ++pidCounter;
                    out(`spawning background interval worker daemon (pid ${pid})...`);
                    let timer = setInterval(() => {}, 5000);
                    backgroundProcesses[pid] = { name: "bus_monitor_daemon", timer: timer, time: Date.now() };
                    break;

                case (cmd === 'sys-exec'):
                    let scriptCode = args.join(' ');
                    if (!scriptCode) { out("error: provide script code to execute."); break; }
                    out(`executing evaluation expression...`);
                    try {
                        let evalResult = eval(scriptCode);
                        out(`execution success. return: ${evalResult}`);
                    } catch (err) {
                        out(`execution error: ${err.message}`);
                    }
                    break;

                case (cmd === 'hexdump'):
                    let hexLines = [
                        "0000: 24 62 6f 72 61 7a 69 6f | $borazio",
                        "0008: 2d 72 6f 6f 74 20 4d 4f | -root mo"
                    ];
                    outProgressive(hexLines);
                    break;

                case (cmd === 'gate'):
                    const op = args[0] ? args[0].toLowerCase() : 'and';
                    const s1 = parseInt(args[1] || 0);
                    const s2 = parseInt(args[2] || 0);
                    let res = (op === 'and' ? s1 & s2 : op === 'or' ? s1 | s2 : s1 ^ s2);
                    out(`logic_gate_${op}(${s1},${s2}) = ${res}`);
                    break;

                case (cmd === 'cache'):
                    out(`storage cache status: ${Math.round(JSON.stringify(fileSystem).length)} bytes cached in memory.`);
                    break;

                case (cmd === 'matrix'):
                    let matrixLines = [];
                    for(let i=0; i<5; i++) {
                        matrixLines.push(Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15));
                    }
                    outProgressive(matrixLines);
                    break;

                case (cmd === 'rst-scr'):
                    historyDiv.innerHTML = '';
                    saveCurrentRoomState();
                    break;

                case (cmd === 'ver'):
                    out(`$borazio-root v${KernelCore.version} (native core)`);
                    break;

                case (cmd === 'halt'):
                    out("system halted. cpu core offline.");
                    out("press enter or click to reboot.");
                    isHalted = true;
                    input.style.display = 'none'; 
                    break;

                default:
                    out(`error: '${cmd}' not recognized. type '/help' to view options.`);
            }
        }

        function updatePrompt() {
            PROMPT_BASE = `("true") ["${currentDir}"] = "<span class="color-green">$borazio-root</span>":`;
            document.getElementById('prompt-label').innerHTML = PROMPT_BASE;
        }

        document.addEventListener('click', () => {
            if (isHalted) {
                location.reload();
            } else {
                input.focus();
            }
        });
    </script>
</body>
</html>
